<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sierpinski Carpet - WebGL</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .controls {
            margin: 20px;
        }

        canvas {
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <h1>Sierpinski Carpet</h1>

    <div class="controls">
        분할 횟수:
        <input type="range" id="depth" min="0" max="5" value="3">
        <span id="depthText">3</span>

        &nbsp;&nbsp;

        색상:
        <input type="color" id="color" value="#3366ff">
    </div>

    <canvas id="canvas" width="700" height="700"></canvas>

<script>

const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl");

if (!gl) {
    alert("WebGL을 사용할 수 없습니다.");
}


// Vertex Shader
const vertexShaderSource = `
attribute vec2 aPosition;

void main() {
    gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;


// Fragment Shader
const fragmentShaderSource = `
precision mediump float;

uniform vec4 uColor;

void main() {
    gl_FragColor = uColor;
}
`;


// Shader 생성
function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    return shader;
}


const vertexShader =
    createShader(gl.VERTEX_SHADER, vertexShaderSource);

const fragmentShader =
    createShader(gl.FRAGMENT_SHADER, fragmentShaderSource);


// Shader Program
const program = gl.createProgram();

gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);

gl.linkProgram(program);
gl.useProgram(program);


// Shader 변수 위치
const positionLocation =
    gl.getAttribLocation(program, "aPosition");

const colorLocation =
    gl.getUniformLocation(program, "uColor");


// Buffer
const buffer = gl.createBuffer();

let vertices = [];


// 정사각형 추가
function addSquare(x, y, size) {

    const h = size / 2;

    const left = x - h;
    const right = x + h;

    const top = y + h;
    const bottom = y - h;

    vertices.push(

        left, top,
        left, bottom,
        right, top,

        right, top,
        left, bottom,
        right, bottom

    );
}


// Sierpinski Carpet
function carpet(x, y, size, depth) {

    if (depth === 0) {

        addSquare(x, y, size);

        return;
    }

    const newSize = size / 3;

    for (let row = -1; row <= 1; row++) {

        for (let col = -1; col <= 1; col++) {

            // 가운데 칸 제외
            if (row === 0 && col === 0) {
                continue;
            }

            carpet(
                x + col * newSize,
                y + row * newSize,
                newSize,
                depth - 1
            );

        }

    }
}


// HEX 색상 → RGB
function hexToRgb(hex) {

    return [

        parseInt(hex.substring(1, 3), 16) / 255,

        parseInt(hex.substring(3, 5), 16) / 255,

        parseInt(hex.substring(5, 7), 16) / 255

    ];
}


// 화면 그리기
function draw() {

    const depth =
        Number(document.getElementById("depth").value);

    const color =
        document.getElementById("color").value;


    vertices = [];

    carpet(0, 0, 1.8, depth);


    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

    gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array(vertices),
        gl.STATIC_DRAW
    );


    gl.enableVertexAttribArray(positionLocation);

    gl.vertexAttribPointer(
        positionLocation,
        2,
        gl.FLOAT,
        false,
        0,
        0
    );


    gl.clearColor(1, 1, 1, 1);

    gl.clear(gl.COLOR_BUFFER_BIT);


    const rgb = hexToRgb(color);

    gl.uniform4f(
        colorLocation,
        rgb[0],
        rgb[1],
        rgb[2],
        1
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        vertices.length / 2
    );
}


// 분할 횟수 변경
document
    .getElementById("depth")
    .addEventListener("input", function () {

        document.getElementById("depthText").textContent =
            this.value;

        draw();

    });


// 색상 변경
document
    .getElementById("color")
    .addEventListener("input", draw);


gl.viewport(
    0,
    0,
    canvas.width,
    canvas.height
);


// 최초 실행
draw();

</script>

</body>
</html>
