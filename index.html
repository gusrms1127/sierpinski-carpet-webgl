<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Sierpinski Carpet</title>
<style>
    body { text-align:center; font-family:Arial; }
    canvas { border:1px solid black; }
    .controls { margin:20px; }
</style>
</head>

<body>

<h1>Sierpinski Carpet</h1>

<div class="controls">
    분할 횟수:
    <input id="depth" type="range" min="0" max="5" value="3">
    <span id="depthText">3</span>

    색상:
    <input id="color" type="color" value="#3366ff">
</div>

<canvas id="canvas" width="700" height="700"></canvas>

<script>

const $ = id => document.getElementById(id);
const gl = $("canvas").getContext("webgl");

function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    return s;
}

const vs = shader(gl.VERTEX_SHADER, `
    attribute vec2 position;
    void main() {
        gl_Position = vec4(position, 0, 1);
    }
`);

const fs = shader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform vec4 color;
    void main() {
        gl_FragColor = color;
    }
`);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);

const position = gl.getAttribLocation(program, "position");
const color = gl.getUniformLocation(program, "color");
const buffer = gl.createBuffer();

let vertices = [];

function square(x, y, size) {
    const h = size / 2;

    vertices.push(
        x-h, y+h,  x-h, y-h,  x+h, y+h,
        x+h, y+h,  x-h, y-h,  x+h, y-h
    );
}

function carpet(x, y, size, depth) {
    if (depth === 0) {
        square(x, y, size);
        return;
    }

    const s = size / 3;

    for (let row = -1; row <= 1; row++)
        for (let col = -1; col <= 1; col++)
            if (row !== 0 || col !== 0)
                carpet(x + col*s, y + row*s, s, depth-1);
}

function draw() {
    vertices = [];
    carpet(0, 0, 1.8, +$("depth").value);

    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array(vertices),
        gl.STATIC_DRAW
    );

    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const hex = $("color").value;
    const rgb = [1, 3, 5].map(i =>
        parseInt(hex.slice(i, i+2), 16) / 255
    );

    gl.clearColor(1, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform4f(color, rgb[0], rgb[1], rgb[2], 1);

    gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 2);
}

$("depth").oninput = function() {
    $("depthText").textContent = this.value;
    draw();
};

$("color").oninput = draw;

gl.viewport(0, 0, 700, 700);
draw();

</script>
</body>
</html>
